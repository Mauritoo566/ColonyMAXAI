<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ColonyMAXAI</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hud">
    <div class="hud-row">
      <div class="hud-stat"><span class="hud-label">Altura</span> <span id="altitude">–</span></div>
      <div class="hud-stat"><span class="hud-label">Hora</span> <span id="time">–</span></div>
      <div class="hud-stat"><span class="hud-label">Bioma</span> <span id="biome">–</span></div>
      <div class="hud-stat" hidden><span class="hud-label">Colonos</span> <span id="colonists">0</span></div>
    </div>
    <div class="hud-speed" role="group" aria-label="Velocidad del tiempo">
      <button type="button" data-speed="0" aria-pressed="false">Pausa</button>
      <button type="button" data-speed="1" aria-pressed="true">×1</button>
      <button type="button" data-speed="10" aria-pressed="false">×10</button>
      <button type="button" data-speed="60" aria-pressed="false">×60</button>
    </div>
    <div class="hud-help">Arrastrar: mover · Rueda o pellizcar: zoom · Botón derecho o Shift: girar y mirar arriba</div>
  </div>
  <div class="camp-panel">
    <button type="button" id="found-camp" class="is-primary">Fundar campamento</button>
    <button type="button" id="go-camp" hidden>Ir al campamento</button>
    <button type="button" id="relocate-camp" hidden>Reubicar</button>
    <button type="button" id="cancel-camp" hidden>Cancelar</button>
  </div>
  <div id="place-banner" class="place-banner" hidden>
    Elige un lugar en tierra firme y haz clic para fundar el campamento · Esc para cancelar
  </div>
  <div id="place-tooltip" class="place-tooltip" hidden></div>
  <div id="labels" class="labels"></div>
  <div id="camp-marker" class="camp-marker" hidden>
    <span class="camp-marker-label">Campamento</span>
    <span class="camp-marker-pin"></span>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
