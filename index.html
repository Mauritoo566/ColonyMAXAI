<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ColonyMAXAI</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hud">
    <div class="hud-row">
      <div class="hud-stat"><span class="hud-label">Altura</span> <span id="altitude">–</span></div>
      <div class="hud-stat"><span class="hud-label">Hora</span> <span id="time">–</span></div>
    </div>
    <div class="hud-speed" role="group" aria-label="Velocidad del tiempo">
      <button type="button" data-speed="0" aria-pressed="false">Pausa</button>
      <button type="button" data-speed="1" aria-pressed="true">×1</button>
      <button type="button" data-speed="10" aria-pressed="false">×10</button>
      <button type="button" data-speed="60" aria-pressed="false">×60</button>
    </div>
    <div class="hud-help">Arrastrar: mover · Rueda o pellizcar: zoom · Botón derecho o Shift: girar</div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
